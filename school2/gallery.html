<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - BKS School</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #f9f9f9;
        }

        .mainHeader {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(0, 51, 153, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            backdrop-filter: blur(10px);
            color: white;
            box-sizing: border-box;
        }

        .logoSec {
            font-size: 24px;
            font-weight: bold;
        }

        .navItems a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-size: 18px;
        }

        .page-header {
            padding: 150px 20px 50px;
            background: #003399;
            text-align: center;
            color: #FFD700;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 60px 10%;
        }

        .gallery-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: 0.3s;
            cursor: pointer;
        }

        .gallery-img:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .footer {
            background: #003399;
            color: white;
            padding: 40px;
            text-align: center;
        }
    </style>
    <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>

<body>

    <header class="mainHeader">
        <div class="logoSec">
            <i class="fa fa-graduation-cap"></i>
            <span>BKS School</span>
        </div>
        <nav class="navItems">
            <a href="index.html">Home</a>
            <a href="infrastructure.html">Infrastructure</a>
            <a href="gallery.html" class="text-yellow">Gallery</a>
            <a href="events.html">Events</a>
            <a href="achievements.html">Achievements</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <section class="page-header">
        <h1>Our Gallery</h1>
        <p>Snapshots of life at BKS</p>
    </section>

    <div class="gallery-grid">
        <img src="img/building-1.jpg" class="gallery-img">
        <img src="img/building-2.jpg" class="gallery-img">
        <img src="img/building-3.jpg" class="gallery-img">
        <img src="img/profile-1.jpg" class="gallery-img">
        <img src="img/profile-2.jpg" class="gallery-img">
        <img src="img/profile-3.jpg" class="gallery-img">
        <img src="img/students playing.jpg" class="gallery-img">
        <img src="img/students in library.jpg" class="gallery-img">
        <img src="img/students eating.jpg" class="gallery-img">
    </div>

    <footer class="footer">
        <p>&copy; 2026 Bharathi Kids Kshethralaya School. All Rights Reserved.</p>
    </footer>

</body>

</html>

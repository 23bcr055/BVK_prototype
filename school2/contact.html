<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - BKS School</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #f0f2f5;
        }

        .mainHeader {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(0, 51, 153, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            backdrop-filter: blur(10px);
            color: white;
            box-sizing: border-box;
        }

        .logoSec {
            font-size: 24px;
            font-weight: bold;
        }

        .navItems a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-size: 18px;
        }

        .page-header {
            padding: 150px 20px 50px;
            background: #003399;
            text-align: center;
            color: white;
        }

        .contact-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            padding: 80px 10%;
        }

        .info-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .info-card h2 {
            color: #003399;
            margin-bottom: 30px;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .info-item i {
            font-size: 24px;
            color: #FFD700;
            margin-right: 20px;
        }

        .form-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .submit-btn {
            background: #003399;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background: #003399;
        }

        .footer {
            background: #003399;
            color: white;
            padding: 40px;
            text-align: center;
        }
    </style>
    <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>

<body>

    <header class="mainHeader">
        <div class="logoSec">
            <i class="fa fa-graduation-cap"></i>
            <span>BKS School</span>
        </div>
        <nav class="navItems">
            <a href="index.html">Home</a>
            <a href="infrastructure.html">Infrastructure</a>
            <a href="gallery.html">Gallery</a>
            <a href="events.html">Events</a>
            <a href="achievements.html">Achievements</a>
            <a href="about.html">About Us</a>
            <a href="contact.html" class="text-yellow">Contact Us</a>
        </nav>
    </header>

    <section class="page-header">
        <h1>Contact BKS</h1>
        <p>We are here to help you</p>
    </section>

    <div class="contact-wrapper">
        <div class="info-card">
            <h2>Contact Details</h2>
            <div class="info-item">
                <i class="fa fa-map-marker"></i>
                <span>Main Road, Tamil Nadu, India</span>
            </div>
            <div class="info-item">
                <i class="fa fa-phone"></i>
                <span>+91 98765 43210</span>
            </div>
            <div class="info-item">
                <i class="fa fa-envelope"></i>
                <span>admissions@bksschool.com</span>
            </div>
        </div>
        <div class="form-card">
            <form>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="Your Email">
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="4" placeholder="Your Message"></textarea>
                </div>
                <button type="submit" class="submit-btn"
                    onclick="event.preventDefault(); alert('Message sent!');">Submit</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 Bharathi Kids Kshethralaya School. All Rights Reserved.</p>
    </footer>

</body>

</html>
